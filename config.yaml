b3ehive:
  platforms:
    codex:
      install_root: ~/.codex/skills
      transport: tmux_codex_tui
      goal_command: /goal
      app_server_workers: forbidden
      process_isolation: one_interactive_process_tree_per_claim
      state_isolation: one_writable_codex_home_per_claim
      worker_lifecycle: repository_specified_bounded_or_persistent_pool
      persistent_service_tui: repository_specified
      automatic_goal_continuation: repository_specified_and_counted
      terminalize_goal_after_result: bounded_mode_only
      persistent_worker_replacement: retire_dead_generation_then_refill_exact_target
      turn_lease_before_submit: required_atomic
      request_lease_before_submit: required_atomic
      max_outstanding_requests_per_execution: 1
      nested_agents: forbidden_unless_repository_specification_admits_and_budgets
      nested_agent_accounting: independent_under_all_global_caps
      request_circuit_breaker: fail_closed_with_explicit_audited_reset
      runner_template: 'tmux -S "{task_root}/tmux.sock" -f /dev/null new-session -d -s "{session}" -c "{workspace}" env -u CODEX_CI -u CODEX_THREAD_ID -u CODEX_REMOTE_PAYLOAD CODEX_HOME="{task_root}/codex-home" codex -C "{workspace}" -c features.goals=true --no-alt-screen'
      goal_completion_token: required_unique_per_claim
      goal_template: 'tmux -S "{task_root}/tmux.sock" set-buffer -b goal "/goal {goal} Integrity token: {goal_completion_token}" && tmux -S "{task_root}/tmux.sock" paste-buffer -b goal -t "{session}" -d'
      goal_delivery_verification: complete_composer_text_required_before_submit
      goal_delivery_probe_template: 'tmux -S "{task_root}/tmux.sock" capture-pane -p -J -t "{session}"'
      goal_submit_template: 'tmux -S "{task_root}/tmux.sock" send-keys -t "{session}" C-m'
      goal_submit_count: 1
      duplicate_goal_submission: forbidden
    claude:
      install_root: ~/.claude/skills
      runner_template: 'claude -p --model "${CLAUDE_MODEL:-sonnet}" --effort "${CLAUDE_EFFORT:-max}" --permission-mode "${CLAUDE_PERMISSION_MODE:-auto}" --add-dir "{workspace}" < "{prompt_file}" > "{output_file}"'
    cursor:
      install_root: ~/.cursor/skills
      runner_template: 'python3 "{b3ehive_root}/scripts/run_cursor_agent.py" --workspace "{workspace}" --prompt-file "{prompt_file}" > "{output_file}"'
    grok:
      install_root: ~/.grok/skills
      runner_template: 'GROK_TELEMETRY_ENABLED=0 GROK_TELEMETRY_TRACE_UPLOAD=0 grok --always-approve --cwd "{workspace}" --prompt-file "{prompt_file}" ${GROK_MODEL:+-m "$GROK_MODEL"} ${GROK_EFFORT:+--effort "$GROK_EFFORT"} > "{output_file}"'
    opencode:
      install_root: ~/.config/opencode/skills
      runner_template: 'opencode run --dir "{workspace}" ${OPENCODE_MODEL:+--model "$OPENCODE_MODEL"} ${OPENCODE_VARIANT:+--variant "$OPENCODE_VARIANT"} ${OPENCODE_AGENT:+--agent "$OPENCODE_AGENT"} < "{prompt_file}" > "{output_file}"'
    openclaw:
      install_root: ~/.openclaw/skills
      runner_template: 'openclaw ${OPENCLAW_PROFILE:+--profile "$OPENCLAW_PROFILE"} agent --local ${OPENCLAW_AGENT:+--agent "$OPENCLAW_AGENT"} ${OPENCLAW_THINKING:+--thinking "$OPENCLAW_THINKING"} --message "$(cat "{prompt_file}")" > "{output_file}"'
    hermes:
      install_root: ~/.hermes/skills
      runner_template: 'hermes chat --toolsets "${HERMES_TOOLSETS:-skills,terminal}" ${HERMES_MODEL:+--model "$HERMES_MODEL"} ${HERMES_SKILLS:+-s "$HERMES_SKILLS"} -q "$(cat "{prompt_file}")" > "{output_file}"'
  agents:
    count: 3
    platform: auto
    model:
      codex: null
      claude: sonnet
      cursor: null
      grok: null
      opencode: null
      openclaw: null
      hermes: null
    thinking:
      codex: null
      claude: max
      cursor: null
      grok: null
      opencode: null
      openclaw: high
      hermes: null
  evaluation:
    competition_shape: three_way_challenge
    artifact_layout: old_three_way
    selection_mode: vote_then_tiebreak
    dimensions:
      simplicity: 20
      speed: 25
      stability: 25
      corner_cases: 20
      maintainability: 10
  delivery:
    strategy: auto
    threshold: 15
